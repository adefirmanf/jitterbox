receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  file:
    path: ./etc/logs/otlp-logs.log
    flush_interval: 1

  otlphttp/logs:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

  debug:
    verbosity: basic
  
  prometheus/trace:
    endpoint: "0.0.0.0:8889"

processors:
  batch:

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: []
      exporters: [debug, file, otlphttp/logs]
    # traces:
    #   receivers: [otlp]
    #   processors: []
    #   exporters: []
 
